<!DOCTYPE html>
<html>
<head>
    <title>Test Hospital & Pharmacy APIs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        pre {
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Hospital & Pharmacy APIs</h1>
    
    <div>
        <button onclick="testHospitalsAPI()">Test Hospitals API</button>
        <button onclick="testPharmacyAPI()">Test Pharmacy API</button>
    </div>

    <div id="results"></div>

    <script>
        async function testHospitalsAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">Testing Hospitals API...</div>';

            try {
                const response = await fetch('https://healthcare-gamma-lake.vercel.app/hospitals');
                
                resultsDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <h3>Hospitals API Response</h3>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Content-Type:</strong> ${response.headers.get('content-type')}</p>
                    </div>
                `;

                const text = await response.text();
                
                // Try to parse as JSON
                try {
                    const data = JSON.parse(text);
                    resultsDiv.innerHTML += `
                        <div class="result success">
                            <h3>✅ Valid JSON Response</h3>
                            <p><strong>Type:</strong> ${Array.isArray(data) ? 'Array' : 'Object'}</p>
                            <p><strong>Count:</strong> ${Array.isArray(data) ? data.length : 'N/A'}</p>
                            ${Array.isArray(data) && data.length > 0 ? `
                                <h4>First Item:</h4>
                                <pre>${JSON.stringify(data[0], null, 2)}</pre>
                            ` : ''}
                            <h4>Full Response (first 3 items):</h4>
                            <pre>${JSON.stringify(Array.isArray(data) ? data.slice(0, 3) : data, null, 2)}</pre>
                        </div>
                    `;
                } catch (err) {
                    resultsDiv.innerHTML += `
                        <div class="result error">
                            <h3>❌ NOT Valid JSON</h3>
                            <p><strong>Error:</strong> ${err.message}</p>
                            <h4>Raw Response:</h4>
                            <pre>${text.substring(0, 1000)}${text.length > 1000 ? '...' : ''}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        async function testPharmacyAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">Testing Pharmacy API...</div>';

            try {
                const response = await fetch('https://healthcare-gamma-lake.vercel.app/medical-pharmacy');
                
                resultsDiv.innerHTML = `
                    <div class="result ${response.ok ? 'success' : 'error'}">
                        <h3>Pharmacy API Response</h3>
                        <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                        <p><strong>Content-Type:</strong> ${response.headers.get('content-type')}</p>
                    </div>
                `;

                const text = await response.text();
                
                // Try to parse as JSON
                try {
                    const data = JSON.parse(text);
                    resultsDiv.innerHTML += `
                        <div class="result success">
                            <h3>✅ Valid JSON Response</h3>
                            <p><strong>Type:</strong> ${Array.isArray(data) ? 'Array' : 'Object'}</p>
                            <p><strong>Count:</strong> ${Array.isArray(data) ? data.length : 'N/A'}</p>
                            ${Array.isArray(data) && data.length > 0 ? `
                                <h4>First Item:</h4>
                                <pre>${JSON.stringify(data[0], null, 2)}</pre>
                            ` : ''}
                            <h4>Full Response (first 3 items):</h4>
                            <pre>${JSON.stringify(Array.isArray(data) ? data.slice(0, 3) : data, null, 2)}</pre>
                        </div>
                    `;
                } catch (err) {
                    resultsDiv.innerHTML += `
                        <div class="result error">
                            <h3>❌ NOT Valid JSON</h3>
                            <p><strong>Error:</strong> ${err.message}</p>
                            <h4>Raw Response:</h4>
                            <pre>${text.substring(0, 1000)}${text.length > 1000 ? '...' : ''}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML += `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                    </div>
                `;
            }
        }

        // Auto-test on page load
        window.addEventListener('load', () => {
            testHospitalsAPI();
        });
    </script>
</body>
</html>
